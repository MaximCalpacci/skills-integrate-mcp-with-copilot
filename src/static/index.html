<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>


    <main>
      <section id="signup-container">
        <h3>Register for an Activity</h3>
        <div id="message" class="hidden"></div>
        <p>Click the "Register Student" button on any activity below to sign up.</p>
        <div id="activity-controls">
          <input type="text" id="search-box" placeholder="Search activities..." />
          <select id="sort-select">
            <option value="name">Sort by Name</option>
            <option value="spots">Sort by Spots Left</option>
          </select>
          <select id="category-filter">
            <option value="">All Categories</option>
            <option value="Club">Club</option>
            <option value="Team">Team</option>
            <option value="Class">Class</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </section>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
